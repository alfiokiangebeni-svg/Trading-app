name: Données pour la version web (annonces, football, marchés)

# Copie de secours, lisible via raw.githubusercontent.com, pour la version web :
# - le calendrier ForexFactory (qui n'autorise pas la lecture directe depuis une page web) ;
# - les classements et matchs ESPN des 13 compétitions du bot football (si la lecture directe échoue) ;
# - l'historique Yahoo Finance du simulateur (or GC=F, EUR/USD, S&P 500 ES=F) : 5 min (qui s'allonge à chaque passage), 1 h sur 2 ans, journalier.
# L'APK et l'app PC lisent les sources directement ; cette copie ne sert qu'en secours.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [claude/trading-analysis-app-gold-btc-zdnf42]
    paths: ['.github/workflows/web-data.yml']

permissions:
  contents: write

concurrency:
  group: web-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Télécharger le calendrier
        run: |
          curl -fsSL --retry 3 -A "Mozilla/5.0 (AlerteTrading calendar mirror)" https://nfs.faireconomy.media/ff_calendar_thisweek.json -o /tmp/calendar.json
          python3 -c "import json; d=json.load(open('/tmp/calendar.json')); assert isinstance(d, list) and len(d) > 5, len(d); print(len(d), 'annonces')"
      - name: Télécharger les données football (classements + matchs de J-3 à J+6)
        run: |
          mkdir -p /tmp/football
          for lg in fra.1 eng.1 esp.1 ita.1 ger.1 uefa.champions uefa.europa por.1 ned.1 bel.1 tur.1 sau.1 usa.1; do
            mkdir -p /tmp/football/$lg
            curl -fsSL --retry 2 --compressed "https://site.api.espn.com/apis/v2/sports/soccer/$lg/standings" -o /tmp/football/$lg/standings.json || echo "standings $lg indisponible"
            for k in -3 -2 -1 0 1 2 3 4 5 6; do
              d=$(date -u -d "$k day" +%Y%m%d)
              curl -fsSL --retry 2 --compressed "https://site.api.espn.com/apis/site/v2/sports/soccer/$lg/scoreboard?dates=$d" -o /tmp/football/$lg/$d.json || echo "$lg $d indisponible"
              sleep 0.3
            done
          done
          find /tmp/football -name '*.json' -size 0 -delete
          echo "$(find /tmp/football -name '*.json' | wc -l) fichiers football"
      - name: Télécharger l'historique des marchés (Yahoo Finance)
        run: |
          mkdir -p /tmp/market
          python3 - <<'PY'
          import json, time, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (AlerteTrading market mirror)"}
          for sym in ["GC=F", "EURUSD=X", "ES=F"]:
              name = "".join(ch if ch.isalnum() else "_" for ch in sym)
              for interval, rng, tag in [("5m", "range=60d", "5m"), ("60m", "range=730d", "1h"), ("1d", f"period1=946684800&period2={int(time.time())}", "1d")]:
                  # journalier : période explicite depuis 2000 (range=max renvoie des bougies mensuelles)
                  url = f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}?interval={interval}&{rng}&includePrePost=true"
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60) as r:
                          res = json.load(r)["chart"]["result"][0]
                  except Exception as e:
                      print("indisponible", sym, interval, e); continue
                  q = res["indicators"]["quote"][0]
                  rows = {t: [t, round(o, 6), round(h, 6), round(l, 6), round(c, 6), int(v or 0)] for t, o, h, l, c, v in
                          zip(res["timestamp"], q["open"], q["high"], q["low"], q["close"], q.get("volume") or [0] * len(res["timestamp"])) if None not in (o, h, l, c)}
                  # l'historique s'allonge : on garde les bougies déjà copiées les jours précédents
                  if res["meta"].get("dataGranularity") not in (interval, "1h" if interval == "60m" else interval):
                      print("granularité inattendue", sym, interval, res["meta"].get("dataGranularity")); continue
                  try:
                      old_url = f"https://raw.githubusercontent.com/${{ github.repository }}/data/market/{name}_{tag}.json"
                      with urllib.request.urlopen(old_url, timeout=60) as r:
                          for row in json.load(r).get("rows", []):
                              if tag != "1d" or len(rows) < 1000: rows.setdefault(row[0], row if len(row) > 5 else row + [0])  # volume ajouté en 2.5
                  except Exception as e:
                      print("pas d'ancienne copie", name, tag, e)
                  out = [rows[k] for k in sorted(rows)]
                  json.dump({"sym": sym, "interval": tag, "rows": out}, open(f"/tmp/market/{name}_{tag}.json", "w"), separators=(",", ":"))
                  print(sym, tag, len(out), "bougies")
                  time.sleep(1)
          PY
      - name: Publier dans la branche data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git checkout -B data FETCH_HEAD
          else
            git checkout --orphan data
            git rm -rfq --cached .
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          cp /tmp/calendar.json calendar.json
          rm -rf football && cp -r /tmp/football football
          if [ -n "$(ls -A /tmp/market 2>/dev/null)" ]; then rm -rf market && cp -r /tmp/market market; fi
          # garder seulement les journées récentes (les anciennes sont supprimées à chaque passage)
          git add -A calendar.json football market
          if git diff --cached --quiet; then echo "Pas de changement"; exit 0; fi
          git commit -m "Données web (annonces, football, marchés) $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push origin data
